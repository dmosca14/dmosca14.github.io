    <style>

            color: var(--text-secondary);

            border-radius: 8px;
            border-left: 4px solid var(--text-secondary);
        }

        ul.conference-list li strong {
            color: var(--accent-color);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-top: 1px solid var(--surface-color);
